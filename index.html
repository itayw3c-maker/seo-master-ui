<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEO Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- התחברות -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="logo">SEO<span>Master</span></div>
      <p class="muted">מערכת הקידום של צוות הודיה</p>
      <button type="button" class="google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        כניסה עם Google
      </button>
      <p id="login-msg" class="msg"></p>
    </div>
  </section>

  <!-- המערכת -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="logo small">SEO<span>Master</span></div>
      <nav class="tabs">
        <button class="tab active" data-view="market">שוק</button>
        <button class="tab" data-view="keywords">ביטויים</button>
      </nav>
      <div class="period muted" id="period"></div>
      <div class="user">
        <button class="icon-btn" id="theme-btn" title="מצב בהיר / כהה">◐</button>
        <span id="user-email"></span>
        <button class="link" id="logout">יציאה</button>
      </div>
    </header>

    <div class="ticker" id="ticker"><div class="ticker-track" id="ticker-track"></div></div>

    <!-- מסך שוק -->
    <main id="view-market" class="view">
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <section class="panel">
          <h3 class="up-t">▲ העולים הגדולים</h3>
          <table class="mini" id="gainers"></table>
        </section>
        <section class="panel">
          <h3 class="down-t">▼ היורדים הגדולים</h3>
          <table class="mini" id="losers"></table>
        </section>
      </div>
      <section class="panel">
        <h3>מדד הלקוחות <span class="muted small">ממוצע המיקום של הביטויים המסומנים בכוכב, ומה השתנה מול 28 הימים הקודמים</span></h3>
        <table class="board" id="board"></table>
      </section>
    </main>

    <!-- מסך ביטויים -->
    <main id="view-keywords" class="view hidden">
      <div class="layout">
        <aside class="sidebar panel">
          <input id="client-search" class="search" placeholder="חיפוש לקוח">
          <ul id="client-list"></ul>
        </aside>
        <section class="main">
          <div id="empty" class="empty">בחר לקוח מהרשימה</div>
          <div id="client-view" class="hidden">
            <div class="client-head">
              <div>
                <h2 id="c-name"></h2>
                <a id="c-domain" target="_blank" rel="noopener"></a>
                <div id="c-badges" class="badges"></div>
              </div>
              <div class="stars-box">
                <div class="stars-count"><span id="star-count">0</span> ★</div>
                <div id="star-hint" class="muted small">יעד: 20-30 ביטויים</div>
              </div>
            </div>
            <div class="toolbar">
              <div class="seg">
                <button data-filter="starred" class="active">מסומנים בכוכב</button>
                <button data-filter="all">כל הביטויים</button>
                <button data-filter="suggest">הצעות מ-Search Console</button>
              </div>
              <input id="kw-search" class="search" placeholder="חיפוש ביטוי">
            </div>
            <div class="table-wrap">
              <table class="board kw-table">
                <thead>
                  <tr>
                    <th class="col-star">★</th>
                    <th>ביטוי</th>
                    <th class="num" title="מיקום ממוצע ב-Search Console, 28 ימים">מיקום</th>
                    <th class="num">שינוי</th>
                    <th class="num">קליקים</th>
                    <th class="num">חשיפות</th>
                    <th class="num">נפח</th>
                    <th>אשכול</th>
                    <th>עמוד יעד</th>
                  </tr>
                </thead>
                <tbody id="kw-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>
  </section>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
